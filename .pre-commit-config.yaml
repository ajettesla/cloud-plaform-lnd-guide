# .pre-commit-config.yaml
repos:
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]
        files: \.md$
        exclude: ^assets/

  - repo: https://github.com/errata-ai/vale
    rev: v3.5.0
    hooks:
      - id: vale
        files: \.md$
        exclude: ^assets/

  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        args: ["--skip", ".git,assets"]
        files: \.md$

  - repo: local
    hooks:
      - id: check-refs
        name: Validate Cross-References
        entry: python scripts/check_refs.py
        language: system
        files: \.md$
        pass_filenames: false

      - id: check-figures
        name: Validate Mermaid Diagrams
        entry: python scripts/check_figures.py
        language: system
        files: \.md$
        pass_filenames: false

      - id: check-listings
        name: Validate Code Listings
        entry: python scripts/check_listings.py
        language: system
        files: \.md$
        pass_filenames: false

      - id: check-frontmatter
        name: Validate Frontmatter
        entry: python scripts/check_frontmatter.py
        language: system
        files: \.md$
        pass_filenames: false
